          - in_progress
          - submitted
          - returned
          - closed
          - action_in_progress
      - name: finding_type
        in: query
        schema:
          type: string
          enum:
          - major_nc
          - minor_nc
      responses:
        '200':
          description: Paginated findings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingsResponse'
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
            X-RateLimit-Limit:
              schema:
                type: integer
            X-RateLimit-Remaining:
              schema:
                type: integer
            X-RateLimit-Reset:
              schema:
                type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServiceError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /audits:
