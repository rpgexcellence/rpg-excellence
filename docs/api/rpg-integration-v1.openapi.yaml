openapi: 3.1.0
info:
  title: RPG Excellence Enterprise Integration API
  version: 1.2.0
  description: 'Organisation-bound read API. Live exports require an active scoped credential and current organisation-owner
    Consultant entitlement (including protected RPG platform administrators). Test keys can call /health only;
    they cannot read customer data. No inbound write API, sandbox dataset or outbound webhook service is released.
    Default budgets: 60 requests per client and 300 per organisation per minute. Respect Retry-After on 429
    responses. A required database or audit-write failure returns 503 without a successful data payload. Every
    identified-key request is logged when the audit database is available; rejected unidentified credentials
    and log-write failures are reported in hosting logs. Existing unassigned legacy findings are excluded until
    their tenant is explicitly confirmed. Offset pagination uses a unique ID tie-breaker; it is not an incremental
    change feed and does not guarantee a snapshot during concurrent updates. Use /exports/{resource} for
    frozen snapshot pages and checkpoint-based changes, including deletions.'
  contact:
    name: RPG Excellence
    url: https://www.rpgexcellence.com
servers:
- url: https://www.rpgexcellence.com/api/v1/integration
  description: Production read API. Test credentials support /health only.
security:
- bearerAuth: []
tags:
- name: Service
- name: Findings
- name: Audits
- name: CAPA-8D
- name: Assets
- name: Suppliers
- name: People
- name: Security incidents
- name: Workplace inspections
paths:
  /health:
    get:
      tags:
      - Service
      summary: Verify API availability and key authentication
      operationId: getIntegrationHealth
      responses:
        '200':
          description: API key accepted and service available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
            X-RateLimit-Limit:
              schema:
                type: integer
            X-RateLimit-Remaining:
              schema:
                type: integer
            X-RateLimit-Reset:
              schema:
                type: integer
        '401':
          $ref: '#/components/responses/Unauthorised'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /findings:
