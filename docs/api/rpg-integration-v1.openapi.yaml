  /workplace-inspections/{id}:
    get:
      tags:
      - Workplace inspections
      summary: Read one complete bounded workplace inspection
      operationId: getWorkplaceInspection
      x-required-permission: workplace_inspections:read
      description: Returns inspection plus responses, findings, actions and evidence metadata. Responses use
        comments_actions (the supplied database field), not comment. Child arrays are capped at 1000 each;
        if an exact count shows truncation, returns 413 instead of incomplete data. Evidence bytes are not
        returned. Unknown or foreign organisation IDs return 404.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Complete bounded inspection detail
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - counts
                - request_id
                properties:
                  data:
                    type: object
                    required:
                    - inspection
                    - responses
                    - findings
                    - actions
                    - evidence
                    properties:
                      inspection:
                        type: object
                      responses:
                        type: array
                        items:
                          type: object
                      findings:
                        type: array
                        items:
                          type: object
                      actions:
                        type: array
                        items:
                          type: object
                      evidence:
                        type: array
                        items:
                          type: object
                  counts:
                    type: object
                    properties:
                      responses:
                        type: integer
                        minimum: 0
                        maximum: 1000
                      findings:
                        type: integer
                        minimum: 0
                        maximum: 1000
                      actions:
                        type: integer
                        minimum: 0
                        maximum: 1000
                      evidence:
                        type: integer
                        minimum: 0
                        maximum: 1000
                  request_id:
                    type: string
                    format: uuid
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
            X-RateLimit-Limit:
              schema:
                type: integer
            X-RateLimit-Remaining:
              schema:
                type: integer
            X-RateLimit-Reset:
              schema:
                type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '413':
          $ref: '#/components/responses/DetailTooLarge'
        '404':
          description: Inspection not found in the API credential organisation.
