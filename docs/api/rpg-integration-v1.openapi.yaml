openapi: 3.1.0
info:
  title: RPG Excellence Enterprise Integration API
  version: 1.0.0
  description: |
    Controlled, organisation-scoped read access to RPG Excellence assurance data.
    Every request requires an active API key and is recorded in the integration event log.
  contact:
    name: RPG Excellence
    url: https://www.rpgexcellence.com
servers:
  - url: https://www.rpgexcellence.com/api/v1/integration
    description: RPG Excellence production service (use a test or live key as appropriate)
security:
  - bearerAuth: []
tags:
  - name: Service
  - name: Findings
  - name: Audits
  - name: CAPA-8D
  - name: Assets
  - name: Suppliers
  - name: People
paths:
  /health:
    get:
      tags: [Service]
      summary: Verify API availability and key authentication
      operationId: getIntegrationHealth
      responses:
        "200":
          description: API key accepted and service available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "401":
          $ref: "#/components/responses/Unauthorised"
  /findings:
    get:
      tags: [Findings]
      summary: List major and minor nonconformity findings
      operationId: listFindings
      x-required-permission: findings:read
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema:
            type: string
            enum: [open, assigned, in_progress, submitted, returned, closed]
        - name: finding_type
          in: query
          schema:
            type: string
            enum: [major_nc, minor_nc]
      responses:
        "200":
          description: Paginated findings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServiceError"
  /audits:
    get:
      tags: [Audits]
      summary: List internal and supplier audits
      operationId: listAudits
      x-required-permission: audits:read
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, in_progress, report_draft, report_approved, capa_monitoring, effectiveness_review, closed]
        - name: audit_type
          in: query
          schema:
            type: string
            enum: [internal_system, internal_process, internal_compliance, supplier, second_party, follow_up, integrated]
        - name: planned_from
          in: query
          description: Inclusive ISO 8601 lower date/time boundary.
          schema:
            type: string
            format: date-time
        - name: planned_to
          in: query
          description: Inclusive ISO 8601 upper date/time boundary.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Paginated audits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServiceError"
  /capa-8d:
    get:
      tags: [CAPA-8D]
      summary: List CAPA and 8D cases
      operationId: listCapa8dCases
      x-required-permission: capa:read
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: case_type
          in: query
          schema:
            type: string
            enum: [capa, 8d]
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, effectiveness_review, closed, cancelled]
        - name: severity
          in: query
          schema:
            type: string
            enum: [critical, high, medium, low]
        - name: source_type
          in: query
          schema:
            type: string
            enum: [assessment_finding, audit, complaint, incident, defect, supplier, standalone]
        - name: target_before
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Paginated CAPA-8D cases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapaResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServiceError"
  /assets:
    get:
      tags: [Assets]
      summary: List controlled organisation assets and PPM status
      operationId: listAssets
      x-required-permission: assets:read
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: asset_type
          in: query
          schema:
            type: string
            enum: [plant, equipment, room_area, electrical_system, process_system, vehicle, other]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, out_of_service, retired]
        - name: criticality
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: ppm_status
          in: query
          schema:
            type: string
            enum: [required, not_required, due_30_days, overdue]
      responses:
        "200":
          description: Paginated assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServiceError"
  /suppliers:
    get:
      tags: [Suppliers]
      summary: List controlled suppliers
      operationId: listSuppliers
      x-required-permission: suppliers:read
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: approval_status
          in: query
          schema:
            type: string
            enum: [draft, pending_approval, approved, conditionally_approved, suspended]
        - name: criticality
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: review_status
          in: query
          schema:
            type: string
            enum: [due_30_days, overdue]
      responses:
        "200":
          description: Paginated suppliers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuppliersResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServiceError"
  /people:
    get:
      tags: [People]
      summary: List Company Users
      operationId: listPeople
      x-required-permission: people:read
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: account_status
          in: query
          schema:
            type: string
            enum: [directory, invited, active, suspended, closed]
        - name: site
          in: query
          schema:
            type: string
            maxLength: 180
        - name: department
          in: query
          schema:
            type: string
            maxLength: 180
      responses:
        "200":
          description: Paginated Company Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeopleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServiceError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: RPG API key
      description: Use an active rpg_test_* or rpg_live_* key issued by an authorised RPG Excellence administrator.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100000
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    BadRequest:
      description: Invalid filter or date parameter
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorised:
      description: Missing, invalid, expired or revoked API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Missing permission or source IP not permitted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceError:
      description: Register temporarily unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
        diagnostic_code:
          type: string
    Pagination:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    RegisterResponse:
      type: object
      required: [data, pagination, filters, request_id]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        pagination:
          $ref: "#/components/schemas/Pagination"
        filters:
          type: object
          additionalProperties: true
        request_id:
          type: string
    FindingsResponse:
      $ref: "#/components/schemas/RegisterResponse"
    AuditsResponse:
      $ref: "#/components/schemas/RegisterResponse"
    CapaResponse:
      $ref: "#/components/schemas/RegisterResponse"
    AssetsResponse:
      $ref: "#/components/schemas/RegisterResponse"
    SuppliersResponse:
      $ref: "#/components/schemas/RegisterResponse"
    PeopleResponse:
      $ref: "#/components/schemas/RegisterResponse"
    HealthResponse:
      type: object
      required: [status, service, api_version, environment, client, organisation, permissions, checked_at, request_id]
      properties:
        status:
          type: string
          const: available
        service:
          type: string
        api_version:
          type: string
          const: v1
        environment:
          type: string
          enum: [test, live]
        client:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        organisation:
          type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
        permissions:
          type: array
          items:
            type: string
        checked_at:
          type: string
          format: date-time
        request_id:
          type: string
